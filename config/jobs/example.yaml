# Example job configuration
jobs:
  - id: daily_stocks
    source: my_stocks
    enabled: true
    description: "Fetch stock data daily at 6 PM"
    schedule:
      type: cron
      expression: "0 18 * * 1-5"
    storage:
      backend: parquet
      path: data/raw/stocks

  - id: hourly_news
    source: tech_news
    enabled: true
    description: "Fetch tech news every hour"
    schedule:
      type: interval
      hours: 1
    storage:
      backend: parquet
