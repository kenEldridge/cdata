# Regulatory & Supervisory Data Sources
# Focus: bank call reports, supervisory filings, and examination data

sources:
  # ===================
  # FFIEC CALL REPORTS
  # ===================
  - id: ffiec_call_reports
    name: "FFIEC Call Reports"
    type: ffiec
    enabled: true
    description: "Quarterly bank call report bulk data from FFIEC Central Data Repository"
    primary_keys: ["product", "schedule", "IDRSSD", "reporting_period"]
    config:
      products:
        - call_single       # Single-period call report schedules
      # reporting_period: "20240331"  # Omit to fetch latest available quarter
