# Key entities to track across data sources
# These help correlate data across different sources

entities:
  # Market Benchmarks
  - id: sp500
    name: "S&P 500"
    sources:
      - us_indices
      - macro_proxies
    metadata:
      symbols: ["^GSPC", "SPY"]
      type: index
      description: "US large-cap benchmark"

  - id: treasury_10y
    name: "10-Year Treasury"
    sources:
      - treasury_yields
    metadata:
      symbols: ["^TNX"]
      type: yield
      description: "Benchmark risk-free rate"

  - id: dollar_index
    name: "US Dollar Index"
    sources:
      - currencies
    metadata:
      symbols: ["DX-Y.NYB"]
      type: currency
      description: "Dollar strength vs basket"

  - id: gold
    name: "Gold"
    sources:
      - commodities
      - macro_proxies
    metadata:
      symbols: ["GC=F", "GLD"]
      type: commodity
      description: "Safe haven / inflation hedge"

  - id: crude_oil
    name: "Crude Oil (WTI)"
    sources:
      - commodities
    metadata:
      symbols: ["CL=F"]
      type: commodity
      description: "Energy price benchmark"

  - id: vix
    name: "VIX Volatility Index"
    sources:
      - us_indices
    metadata:
      symbols: ["^VIX"]
      type: volatility
      description: "Market fear gauge"
